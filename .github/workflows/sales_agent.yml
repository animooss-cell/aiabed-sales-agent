name: 24/7 Cloud AI Sales Agent for aiabed.ir

on:
  schedule:
    # اجرا به صورت خودکار هر ۱۰ دقیقه، ۲۴ ساعته روی سرورهای ابری گیت‌هاب
    - cron: '*/10 * * * *'
  workflow_dispatch: # امکان اجرای دستی در هر لحظه
  push:
    branches:
      - main
    paths:
      - 'cloud_sales_agent.py'
      - 'link_utils.py'
      - '.github/workflows/sales_agent.yml'

jobs:
  cloud-sales-agent:
    runs-on: ubuntu-latest
    concurrency:
      group: sales-agent-cron
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            python -m playwright install chromium
          fi
          python -m playwright install-deps chromium || true

      - name: Unlock Vault, Run Cloud Sales Agent, and Lock Vault
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python crypto_state.py unlock
          python cloud_sales_agent.py --mode cron
          python crypto_state.py lock

      - name: Commit & Push Encrypted State Vault
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Abed AI Sales Agent (Cloud)"
          git add data_vault.enc
          git diff-index --quiet HEAD || (git commit -m "chore(cloud): sync encrypted state vault [skip ci]" && git pull --rebase origin main && git push origin main)
